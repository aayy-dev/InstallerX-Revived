name: Standard Release

on:
    workflow_dispatch:
        inputs:
            version_tag:
                description: 'Version tag for the release (e.g. 27.0)'
                required: true
                default: '27.0'
    push:
        branches:
            - system-installer
        paths:
            - 'app/src/**'
            - 'app/build.gradle.kts'
            - 'app-process/src/**'
            - 'app-process/build.gradle.kts'
            - 'hidden-api/src/**'
            - 'hidden-api/build.gradle.kts'
            - 'baselineprofile/src/**'
            - 'baselineprofile/build.gradle.kts'
            - 'build-plugins/**'
            - 'build.gradle.kts'
            - 'settings.gradle.kts'
            - 'gradle.properties'
            - 'gradle/**'
            - '.github/workflows/standard_release.yml'

concurrency:
    group: standard-release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_and_release:
        name: Build and Publish Standard Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: read
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5
                with:
                    fetch-depth: 0

            -   name: Resolve version tag
                id: vars
                run: |
                    VERSION_TAG="${{ github.event.inputs.version_tag || '27.0' }}"
                    echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
                    echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

            -   name: Set up JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: 'zulu'
                    java-version: '25'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4
                with:
                    cache-read-only: false

            -   name: Grant execute permission for gradlew
                run: chmod +x ./gradlew

            -   name: Decode signing key (optional)
                env:
                    SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
                    SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
                    SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
                    SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
                run: |
                    if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
                      echo "No release signing material available; falling back to debug signing."
                      exit 0
                    fi
                    mkdir -p keystore
                    echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
                    {
                      echo "storeFile=keystore/carlyu.jks"
                      echo "keyAlias=${SIGNING_KEY_ALIAS}"
                      echo "keyPassword=${SIGNING_KEY_PASSWORD}"
                      echo "storePassword=${SIGNING_STORE_PASSWORD}"
                    } > keystore.properties

            -   name: Build Stable Release APK
                env:
                    GITHUB_ACTOR: ${{ github.actor }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./gradlew assembleStableRelease -PVERSION_NAME="${{ env.VERSION_TAG }}"

            -   name: Rename APK
                id: rename
                run: |
                    APK_DIR=$(find app/build/outputs/apk -type d | grep -iE '/stable/release$' | head -n 1)
                    if [ -z "$APK_DIR" ]; then
                      echo "::error::Stable APK output directory not found"
                      ls -R app/build/outputs/apk
                      exit 1
                    fi
                    ORIG=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
                    if [ -z "$ORIG" ]; then
                      echo "::error::No stable APK produced"
                      ls -R "$APK_DIR"
                      exit 1
                    fi
                    NEW="${APK_DIR}/InstallerX-Revived-rooted-${{ env.VERSION_TAG }}.apk"
                    mv "$ORIG" "$NEW"
                    echo "apk=${NEW}" >> $GITHUB_OUTPUT

            -   name: Replace prior release and tag
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    gh release delete "${{ env.VERSION_TAG }}" --yes --cleanup-tag || echo "No prior release to delete."

            -   name: Create GitHub Release (latest)
                uses: softprops/action-gh-release@v3
                with:
                    name: "InstallerX Revived Rooted ${{ env.VERSION_TAG }}"
                    tag_name: "${{ env.VERSION_TAG }}"
                    target_commitish: ${{ github.sha }}
                    body: |
                        Standard InstallerX Revived build with the Root-install-as-system-UID patch applied on top of upstream `main`.

                        - Default applicationId `com.rosan.installer.x.revived` (installs alongside any device package installer).
                        - Signed Stable Release artifact.
                        - Includes the Lab-section toggle that routes Root installs through `su 1000` so the resolved installer package is recorded as the install initiator.

                        If you need the system-installer bundle override instead, use the matching `${{ env.VERSION_TAG }}-system` pre-release.
                    prerelease: false
                    make_latest: 'true'
                    files: ${{ steps.rename.outputs.apk }}

            -   name: Upload APK artifact
                uses: actions/upload-artifact@v4
                with:
                    name: standard-release-apk-${{ env.VERSION_TAG }}
                    path: ${{ steps.rename.outputs.apk }}
                    if-no-files-found: error

            -   name: Upload mapping
                uses: actions/upload-artifact@v4
                with:
                    name: standard-release-mapping-${{ env.VERSION_TAG }}
                    path: app/build/outputs/apk/**/release/mapping.txt
                    if-no-files-found: ignore
