name: Build System Installer APKs

on:
    workflow_dispatch:
        inputs:
            version_tag:
                description: 'Version tag for the pre-release (e.g. 27.0)'
                required: true
                default: '27.0'
    push:
        branches:
            - system-installer
        paths:
            - 'app/src/**'
            - 'app/build.gradle.kts'
            - 'app-process/src/**'
            - 'app-process/build.gradle.kts'
            - 'hidden-api/src/**'
            - 'hidden-api/build.gradle.kts'
            - 'baselineprofile/src/**'
            - 'baselineprofile/build.gradle.kts'
            - 'build-plugins/**'
            - 'build.gradle.kts'
            - 'settings.gradle.kts'
            - 'gradle.properties'
            - 'gradle/**'
            - '.github/workflows/build_system_installer.yml'

concurrency:
    group: system-installer-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build (${{ matrix.app_id }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        strategy:
            fail-fast: false
            matrix:
                app_id:
                    - com.android.packageinstaller
                    - com.google.android.packageinstaller
                    - com.samsung.android.packageinstaller
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5
                with:
                    fetch-depth: 0

            -   name: Resolve version tag
                run: |
                    VERSION_TAG="${{ github.event.inputs.version_tag || '27.0' }}"
                    echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

            -   name: Set up JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: 'zulu'
                    java-version: '25'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4
                with:
                    cache-read-only: false

            -   name: Grant execute permission for gradlew
                run: chmod +x ./gradlew

            -   name: Decode signing key (optional)
                env:
                    SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
                    SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
                    SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
                    SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
                run: |
                    if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
                      echo "No release signing material available; falling back to debug signing."
                      exit 0
                    fi
                    mkdir -p keystore
                    echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
                    {
                      echo "storeFile=keystore/carlyu.jks"
                      echo "keyAlias=${SIGNING_KEY_ALIAS}"
                      echo "keyPassword=${SIGNING_KEY_PASSWORD}"
                      echo "storePassword=${SIGNING_STORE_PASSWORD}"
                    } > keystore.properties

            -   name: Build Stable Release APK with override APP_ID
                env:
                    GITHUB_ACTOR: ${{ github.actor }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./gradlew assembleStableRelease -PAPP_ID="${{ matrix.app_id }}" -PVERSION_NAME="${{ env.VERSION_TAG }}"

            -   name: Rename APK
                id: rename
                run: |
                    APK_DIR=$(find app/build/outputs/apk -type d | grep -iE '/stable/release$' | head -n 1)
                    if [ -z "$APK_DIR" ]; then
                      echo "::error::Stable APK output directory not found"
                      ls -R app/build/outputs/apk
                      exit 1
                    fi
                    ORIG=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
                    if [ -z "$ORIG" ]; then
                      echo "::error::No stable APK produced"
                      ls -R "$APK_DIR"
                      exit 1
                    fi
                    NEW="${APK_DIR}/InstallerX-Revived-system-${{ env.VERSION_TAG }}-${{ matrix.app_id }}.apk"
                    mv "$ORIG" "$NEW"
                    echo "apk=${NEW}" >> $GITHUB_OUTPUT

            -   name: Dump merged manifest facts
                run: |
                    AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -1)
                    echo "=== package / sharedUserId ==="
                    "$AAPT2" dump badging "${{ steps.rename.outputs.apk }}" | grep -E "^package|sharedUserId" || true

            -   name: Upload APK artifact
                uses: actions/upload-artifact@v4
                with:
                    name: system-installer-${{ matrix.app_id }}-${{ env.VERSION_TAG }}
                    path: ${{ steps.rename.outputs.apk }}
                    if-no-files-found: error

    release:
        name: Publish System Installer Pre-Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5
                with:
                    fetch-depth: 1

            -   name: Resolve version tag
                run: |
                    VERSION_TAG="${{ github.event.inputs.version_tag || '27.0' }}"
                    echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

            -   name: Download all APKs
                uses: actions/download-artifact@v4
                with:
                    path: dist
                    pattern: system-installer-*
                    merge-multiple: true

            -   name: Replace prior pre-release and tag
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    gh release delete "${{ env.VERSION_TAG }}-system" --yes --cleanup-tag || echo "No prior pre-release to delete."

            -   name: Create GitHub Pre-Release
                uses: softprops/action-gh-release@v3
                with:
                    name: "InstallerX Revived System Installer ${{ env.VERSION_TAG }}"
                    tag_name: "${{ env.VERSION_TAG }}-system"
                    target_commitish: ${{ github.sha }}
                    body: |
                        System-installer variants of InstallerX Revived at version `${{ env.VERSION_TAG }}`, with the Root-install-as-system-UID patch applied.

                        Pick the APK whose `applicationId` matches the stock package installer on your device:

                        | File | Replaces the stock installer on |
                        | --- | --- |
                        | `InstallerX-Revived-system-${{ env.VERSION_TAG }}-com.android.packageinstaller.apk` | AOSP, LineageOS, and most non-OEM ROMs |
                        | `InstallerX-Revived-system-${{ env.VERSION_TAG }}-com.google.android.packageinstaller.apk` | Pixel / Google-signed GMS ROMs |
                        | `InstallerX-Revived-system-${{ env.VERSION_TAG }}-com.samsung.android.packageinstaller.apk` | Samsung One UI |

                        Confirm the right one with `adb shell pm list packages | grep -i packageinstaller` on your device.

                        This release is marked pre-release because replacing the stock installer is device-specific and requires removing or disabling the matching stock package first.

                        For a build that installs alongside the stock installer (default `com.rosan.installer.x.revived` applicationId), use the matching `${{ env.VERSION_TAG }}` release.
                    prerelease: true
                    make_latest: 'false'
                    files: dist/*.apk
